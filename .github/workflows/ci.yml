name: CI

# 触发策略：主分支推送 + 所有 PR。
# 刻意不限制路径，因为任何改动都可能破坏构建（基础设施代码尤其如此）。
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 同一分支的重复推送取消旧任务，节省 CI 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------- 静态检查
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,operator]"

      - name: Ruff check
        run: ruff check src tests bench deploy tools

      - name: Ruff format check
        run: ruff format --check src tests bench deploy tools

      - name: Mypy
        run: mypy src
        continue-on-error: true   # 类型检查暂不阻塞（渐进式收紧）

  # ---------------------------------------------------------------- 单元测试
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,operator]"

      - name: Run tests with coverage
        run: pytest tests/ -q --cov=aetherserve --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------- 性能回归
  benchmark:
    name: Benchmark & Model Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          # 需要 operator 依赖，因为 verify_model.py 会通过包导入链触达 operator 模块
          pip install -e ".[dev,operator]"

      - name: Verify simulation model (解析预测 vs 实测，必须 PASS)
        run: python bench/verify_model.py

      - name: Benchmark (serial vs continuous batching)
        run: |
          python bench/run_bench.py --mode sim \
            --concurrency 1,8,16 --requests 32 --max-tokens 16 --prompt-tokens 128

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench/results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------- 部署清单校验
  manifests:
    name: Helm & Manifest Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: azure/setup-helm@v4

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,operator]"

      - name: Regenerate CRD from code and check it is up to date
        run: |
          python deploy/k8s/generate_manifests.py --all --out /tmp/crd.yaml
          # 若生成结果与仓库中的不一致，说明有人改了 crd.py 但没重新生成清单
          if ! diff -q /tmp/crd.yaml deploy/k8s/aetherserve-crd.yaml > /dev/null; then
            echo "::error::deploy/k8s/aetherserve-crd.yaml 与代码不一致，请运行 generate_manifests.py 重新生成"
            diff /tmp/crd.yaml deploy/k8s/aetherserve-crd.yaml | head -40
            exit 1
          fi

      - name: Helm lint
        run: helm lint deploy/helm/aetherserve

      - name: Verify rendered chart (官方模型反序列化 + 安全不变量)
        run: python deploy/helm/verify_chart.py

      - name: Verify documentation consistency
        run: python tools/check_docs.py

      - name: Verify README claims match the repository
        run: python tools/check_readme.py

  # ---------------------------------------------------------------- 镜像构建
  build:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (不推送，仅验证可构建)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: aetherserve/gateway:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          set -x
          # 用与生产一致的方式启动：通过环境变量注入配置。
          # 这一步曾经抓到过一个真实 bug：AETHERSERVE_BACKEND 与 Settings.backend
          # 字段名冲突，导致 pydantic-settings 把字符串当 JSON 解析、服务启动即崩。
          # 本地用默认值跑不会暴露，只有这种"按生产方式注入配置"的测试才能发现。
          docker run -d --name gateway-smoke -p 8000:8000 \
            -e AETHERSERVE_BACKEND=echo \
            -e AETHERSERVE_MODEL=echo-1 \
            -e AETHERSERVE_ENVIRONMENT=prod \
            aetherserve/gateway:ci-${{ github.sha }}

          # 等待就绪；若容器提前退出则立即失败并打印日志（避免空等 30 秒才报错）
          ready=0
          for i in $(seq 1 30); do
            if ! docker inspect -f '{{.State.Running}}' gateway-smoke | grep -q true; then
              echo "::error::容器在就绪前退出"
              docker logs gateway-smoke
              exit 1
            fi
            if curl -sf http://localhost:8000/healthz > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::30 秒内未通过健康检查"
            docker logs gateway-smoke
            exit 1
          fi

          echo "--- /healthz ---"
          curl -sf http://localhost:8000/healthz
          echo ""
          echo "--- /v1/models ---"
          curl -sf http://localhost:8000/v1/models -H 'Authorization: Bearer sk-demo-001'
          echo ""
          echo "--- /v1/chat/completions ---"
          curl -sf http://localhost:8000/v1/chat/completions \
            -H 'Authorization: Bearer sk-demo-001' \
            -H 'Content-Type: application/json' \
            -d '{"model":"echo-1","messages":[{"role":"user","content":"hi"}],"max_tokens":4}'
          echo ""
          echo "--- /metrics（确认 LLM 专项指标已暴露）---"
          curl -sf http://localhost:8000/metrics | grep -E '^aetherserve_(requests_total|batch_size|queue_depth)' | head -5
          echo ""
          echo "--- 容器日志 ---"
          docker logs gateway-smoke | tail -20
          docker rm -f gateway-smoke
