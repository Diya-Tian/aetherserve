[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherserve"
version = "0.1.0"
description = "面向大模型的多租户云原生推理服务平台：OpenAI 兼容协议 + 连续批处理 + Kubernetes Operator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AetherServe Contributors" }]
keywords = ["llm", "inference", "kubernetes", "operator", "continuous-batching", "vllm", "cloud-native"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "orjson>=3.9",
    "tenacity>=8.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
operator = [
    "kubernetes>=29.0.0",
    "kopf>=1.37",
    "pyyaml>=6.0",
]
vllm = [
    "vllm>=0.6.0",
    "transformers>=4.44",
    "torch>=2.3",
]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "locust>=2.24",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/your-name/aetherserve"
Repository = "https://github.com/your-name/aetherserve"

[project.scripts]
aetherserve = "aetherserve.gateway.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gpu: 需要 GPU 的测试",
    "e2e: 需要 kind 集群的端到端测试",
]

[tool.coverage.run]
source = ["aetherserve"]
omit = ["*/backends/vllm_backend.py", "*/backends/transformers_backend.py"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = [
    "E501",    # 行宽交给 formatter 判断，中文注释按字符数算会误报
    "RUF001",  # 字符串中的"歧义"全角标点：本项目注释与文案全为中文，属正常用法
    "RUF002",  # docstring 中的全角标点：同上
    "RUF003",  # 注释中的全角标点：同上
    "B008",    # FastAPI 的 Depends()/Header() 必须写在默认参数里，这是框架既定范式
]

[tool.ruff.lint.per-file-ignores]
# 测试里大量使用中文断言消息与文档字符串，且允许较随意的导入位置
"tests/*" = ["E402", "N806"]
# 基准脚本需要先插入 sys.path 再导入项目模块
"bench/*" = ["E402"]
# 运维脚本同理（从仓库根目录定位 src）；verify_chart 需要私有反序列化接口
"deploy/*" = ["E402", "SLF001"]

[tool.mypy]
python_version = "3.11"
packages = ["aetherserve"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
# kopf 处理器的回调签名由框架在运行时注入参数，静态类型无法表达，
# 且这两个模块是"集群 I/O 胶水层"（真实执行路径只能在集群里验证），
# 因此排除出严格类型检查：核心逻辑（reconciler/canary/builders/crd）全部纳入检查。
exclude = [
    "^src/aetherserve/operator/handlers\\.py$",
    "^src/aetherserve/operator/main\\.py$",
]
